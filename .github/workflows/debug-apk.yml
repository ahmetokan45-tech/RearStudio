name: Debug APK
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;35.0.0
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Build, unit tests and lint
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug
      - name: Verify installable debug package
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging app/build/outputs/apk/debug/app-debug.apk > app/build/reports/apk-badging.txt
          python3 - <<'PYVERIFY'
          from pathlib import Path
          import hashlib, subprocess, zipfile
          apk=Path("app/build/outputs/apk/debug/app-debug.apk")
          with zipfile.ZipFile(apk) as archive:
              assert archive.testzip() is None
              assert "AndroidManifest.xml" in archive.namelist()
              assert "classes.dex" in archive.namelist()
          badging=Path("app/build/reports/apk-badging.txt").read_text()
          assert "package: name='de.rearstudio.v56dev'" in badging
          assert "sdkVersion:'35'" in badging
          text="Commit: "+subprocess.check_output(["git","rev-parse","HEAD"]).decode().strip()+"\nSHA-256: "+hashlib.sha256(apk.read_bytes()).hexdigest()+"\n"
          Path("app/build/reports/apk-verification.txt").write_text(text+badging)
          print(text)
          PYVERIFY
      - name: Name APK
        run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/AHM3T45-STUDIO-V56-development.apk
      - uses: actions/upload-artifact@v4
        with:
          name: AHM3T45-STUDIO-debug-apk
          path: app/build/outputs/apk/debug/AHM3T45-STUDIO-V56-development.apk
          if-no-files-found: error
          retention-days: 14
      - name: Preserve automated test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: V56-check-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.*
            app/build/test-results/
            app/build/reports/studio-preview.png
            app/build/reports/apk-*.txt
          retention-days: 14

  publish-development:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/rear-studio-v56-development'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: AHM3T45-STUDIO-debug-apk
          path: dist
      - name: Publish verified comparison APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v56-dev-${GITHUB_RUN_NUMBER}"
          sha256sum dist/*.apk > dist/SHA256SUMS.txt
          cat > dist/NOTES.md <<'NOTES'
          Native Android development build. Installs separately as AHM3T45 V5.6 Test (de.rearstudio.v56dev).
          Build, unit tests, lint and APK signature/manifest verification passed before publication.
          This is NOT the complete V5.6 product. Target-device tests remain pending.
          See docs/V56_STATUS.md for remaining implementation and docs/V56_DEVICE_TEST_DE.md for hardware checks.
          NOTES
          gh release create "$tag" dist/*.apk dist/SHA256SUMS.txt --target "$GITHUB_SHA" --prerelease --title "AHM3T45 V5.6 development $GITHUB_RUN_NUMBER" --notes-file dist/NOTES.md
