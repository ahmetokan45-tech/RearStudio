name: Debug APK
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Build, unit tests and lint
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug
      - name: Name APK
        run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/AHM3T45-STUDIO-0.6-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: AHM3T45-STUDIO-debug-apk
          path: app/build/outputs/apk/debug/AHM3T45-STUDIO-0.6-debug.apk
          if-no-files-found: error
          retention-days: 14
