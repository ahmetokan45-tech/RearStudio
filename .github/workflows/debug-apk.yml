name: Debug APK
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;35.0.0
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Build, unit tests and lint
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug
      - name: Name APK
        run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/AHM3T45-STUDIO-V56-development.apk
      - uses: actions/upload-artifact@v4
        with:
          name: AHM3T45-STUDIO-debug-apk
          path: app/build/outputs/apk/debug/AHM3T45-STUDIO-V56-development.apk
          if-no-files-found: error
          retention-days: 14
      - name: Preserve automated test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: V56-check-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.*
            app/build/test-results/
            app/build/reports/studio-preview.png
          retention-days: 14
